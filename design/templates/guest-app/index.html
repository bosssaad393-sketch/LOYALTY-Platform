<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141210">
<title>Your Brand Rewards (guest page, design prototype)</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Guest pages: join, terms, card, added. Fake data. Follows design/DESIGN-GUIDE.md, with the "not AI-looking" rule:
   no sparkles, no sheen, no glows. Hairlines, flat surfaces, strict spacing (4/8/12/16/24/32), one gold accent.
   English + Arabic (RTL). Arabic text is machine-written and needs a native review before launch. */
:root{--bg:#141210;--surface:#1B1815;--line:#3D372F;--text:#F3E9D2;--muted:#D9C9A8;--dim:#9A8C74;--gold:#CDA55B;--gold2:#E3C07E;--golddim:#8A6F3A;--bad:#E58B79;--ok:#8DBF8E;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans)}
.page{max-width:440px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 24px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lang{background:none;border:0;color:var(--dim);font:600 13px var(--sans);letter-spacing:.08em;padding:8px 0;cursor:pointer}
.lang b{color:var(--gold2)}
.mark{display:block;height:68px;margin:0 auto 4px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--golddim),transparent);margin:16px 0 20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);text-align:center}
h1{font:600 30px/1.15 var(--serif);text-align:center;margin:8px 0 10px}
.lead{color:var(--muted);text-align:center;font-size:16px;margin-bottom:24px}
.field{margin-bottom:12px}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.in{width:100%;height:56px;background:transparent;color:var(--text);border:0;border-bottom:1px solid var(--line);font:inherit;font-size:18px;padding:0 2px;border-radius:0}
.in:focus{outline:none;border-bottom-color:var(--gold)}
.in.bad{border-bottom-color:var(--bad)}
.err{color:var(--bad);font-size:14px;margin-top:6px;min-height:20px}
.check{display:flex;gap:14px;align-items:flex-start;margin:16px 0;color:var(--muted);font-size:15px}
.check input{appearance:none;flex:none;width:22px;height:22px;border:1px solid var(--golddim);border-radius:6px;margin-top:2px;background:transparent;display:grid;place-items:center}
.check input:checked{background:var(--gold);border-color:var(--gold)}
.check input:checked:after{content:"";width:5px;height:10px;border:solid #1A1410;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
a{color:var(--gold2)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);font:600 16px var(--sans);letter-spacing:.03em;cursor:pointer;margin-top:12px;text-decoration:none}
.btn.primary{background:#CDA55B;border-color:#CDA55B;color:#1A1410}
.btn.apple{background:#000;border-color:#000;color:#fff;box-shadow:0 0 0 1px #3a3a3a}
.btn.google{background:#fff;border-color:#fff;color:#1f1f1f}
.btn svg{width:20px;height:20px}
.note{color:var(--dim);font-size:13.5px;text-align:center;margin-top:20px}
.foot{color:var(--dim);font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-align:center;margin-top:40px}
.foot b{color:var(--gold);font-weight:500}
/* the rewards card */
/* the membership card: a dial on the front (fifty ticks, one per ten points), the till card on the back. Tap to turn it over. */
.foil{background:linear-gradient(100deg,#8A6F3A 0%,#E3C07E 28%,#CDA55B 48%,#F6E4B0 62%,#B58D45 80%,#8A6F3A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.dwrap{perspective:1200px;margin:24px 0 8px;cursor:pointer;direction:ltr}
.dwrap .in{position:relative;height:440px;transition:transform .9s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.dwrap.flip .in{transform:rotateY(180deg)}
.dface{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(205,165,91,.35),0 24px 48px rgba(0,0,0,.5)}
.dfront{background:radial-gradient(320px 280px at 50% 36%,#211d19,#12100e 70%);padding:22px 20px}
.dback{transform:rotateY(180deg);background:linear-gradient(160deg,#F3E9D2,#E6D8B8);color:#141210;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
.dtop{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px}
.dtop .brand{font:600 20px var(--serif);letter-spacing:.42em;color:var(--gold)}.dtop .by{font-size:10px;letter-spacing:.3em;color:var(--dim)}
.dial{display:block;width:272px;height:272px;margin:8px auto 0}
.dmid{position:absolute;left:0;right:0;top:106px;text-align:center}
.dmid b{display:block;font:600 84px/1 var(--serif)}.dmid span{display:block;font-size:11px;letter-spacing:.34em;color:var(--gold);margin-top:6px;text-transform:uppercase}
.dmid em{display:block;font-style:normal;color:var(--dim);font-size:12.5px;line-height:1.35;margin:10px auto 0;max-width:132px}
.dbot{position:absolute;left:20px;right:20px;bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #2c2620;padding-top:14px}
.dbot .who{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}.dbot .no{font:600 24px var(--serif);letter-spacing:.24em;color:var(--text)}
.dback .qrb{background:#fff;border-radius:14px;padding:12px;line-height:0;box-shadow:0 0 0 1px rgba(20,18,16,.12)}.dback .qrb svg{width:170px;height:170px}
.dback small{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#8A6F3A;font-weight:700;margin-top:22px}.dback b{font:600 46px var(--serif);letter-spacing:.22em;margin-top:6px}
.dback p{font-size:13px;color:#5b5143;margin-top:8px}
[dir=rtl] .dmid span,[dir=rtl] .dback small,[dir=rtl] .dbot .who{letter-spacing:0;text-transform:none;font-size:14px}
.tick{display:grid;place-items:center;width:64px;height:64px;border:1px solid var(--gold);border-radius:50%;margin:8px auto 20px;color:var(--gold)}
.tick svg{width:28px;height:28px}
.steps{margin:24px 0 8px;display:grid;gap:14px}
.steps div{display:flex;gap:14px;color:var(--muted);font-size:15px}.steps b{font:600 15px var(--serif);color:var(--gold);width:22px;flex:none}
/* Arabic: letter-spacing and capitals break the joined script, so switch them off and give the small labels a little more size */
[dir=rtl] .lbl,[dir=rtl] .eyebrow,[dir=rtl] .code small,[dir=rtl] .card .pts span,[dir=rtl] .foot,[dir=rtl] .card .by,[dir=rtl] .btn,[dir=rtl] .lang{letter-spacing:0;text-transform:none}
[dir=rtl] .lbl,[dir=rtl] .code small,[dir=rtl] .card .pts span{font-size:14px}[dir=rtl] .eyebrow{font-size:14px}[dir=rtl] .foot{font-size:13px}
[dir=rtl] .card .brand{letter-spacing:.36em}
.terms{padding-left:20px;display:grid;gap:14px;color:var(--muted);font-size:15px}[dir=rtl] .terms{padding-left:0;padding-right:20px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
</style></head><body><div class="page" id="p"></div>
