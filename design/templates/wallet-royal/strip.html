<!doctype html>
<html><head><meta charset="utf-8"><title>Your Brand royal strip (375x123 pt)</title>
<style>
/* Apple store card strip: 375 x 123 pt, rendered at 1x/2x/3x by headless Edge.
   Left ~38% stays calm: Wallet prints the POINTS primary field there. The gold Your Brand lettering lives on the right, like the member card in the app. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#141210}
.s{position:relative;width:375px;height:123px;overflow:hidden;background:#0d0b0a url(src/marble.png) no-repeat;background-size:760px auto;background-position:-330px -250px}
.s::before{content:"";position:absolute;inset:0;background:
 radial-gradient(ellipse 120px 70px at 262px 60px,rgba(13,11,10,.78),rgba(13,11,10,0) 100%),
 linear-gradient(90deg,rgba(13,11,10,.92) 0%,rgba(13,11,10,.55) 36%,rgba(13,11,10,.10) 70%),
 linear-gradient(180deg,rgba(13,11,10,.35),rgba(13,11,10,0) 30%,rgba(13,11,10,0) 70%,rgba(13,11,10,.45))}
.s::after{content:"";position:absolute;inset:0;border-top:.5px solid rgba(205,165,91,.85);border-bottom:.5px solid rgba(205,165,91,.85)}
.lock{position:absolute;left:150px;width:224px;top:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.k{font:600 40px/1 Georgia,"Times New Roman",serif;letter-spacing:.46em;padding-left:.46em;
 background:linear-gradient(100deg,#8A6F3A 0%,#E3C07E 28%,#CDA55B 48%,#F6E4B0 62%,#B58D45 80%,#8A6F3A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.r{width:78px;height:1px;margin-top:11px;background:linear-gradient(90deg,transparent,#CDA55B,transparent)}
</style></head><body><div class="s"><div class="lock"><div class="k">Your Brand</div><div class="r"></div></div></div></body></html>
