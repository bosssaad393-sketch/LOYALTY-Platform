<!doctype html>
<html><head><meta charset="utf-8"><title>Your Brand royal poster artwork (358x448 pt)</title>
<style>
/* Apple "Poster Generic" artwork (iOS 27+): 358 x 448 pt, full bleed. Wallet prints the logo, header, primary and footer fields and the QR over it.
   The art carries only the gold Your Brand lettering and a rule, high on the card like the member card in the app; Wallet prints MEMBER, the name, POINTS and the code below it. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#141210}
.p{position:relative;width:358px;height:448px;overflow:hidden;background:#0d0b0a url(src/marble.png) center/cover no-repeat}
.p::before{content:"";position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(13,11,10,.55) 0%,rgba(13,11,10,0) 22%),
 linear-gradient(0deg,rgba(13,11,10,.94) 0%,rgba(13,11,10,.78) 26%,rgba(13,11,10,0) 56%),
 radial-gradient(ellipse 230px 120px at 179px 118px,rgba(13,11,10,.72),rgba(13,11,10,0) 100%),
 linear-gradient(90deg,rgba(13,11,10,.45) 0%,rgba(13,11,10,0) 55%)}
.lock{position:absolute;left:0;right:0;top:74px;display:flex;flex-direction:column;align-items:center;z-index:2}
.k{font:600 56px/1 Georgia,"Times New Roman",serif;letter-spacing:.46em;padding-left:.46em;
 background:linear-gradient(100deg,#8A6F3A 0%,#E3C07E 28%,#CDA55B 48%,#F6E4B0 62%,#B58D45 80%,#8A6F3A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.r{width:84px;height:1px;margin-top:16px;background:linear-gradient(90deg,transparent,#CDA55B,transparent)}
.t{margin-top:13px;font:700 11px/1 -apple-system,"Segoe UI",system-ui,sans-serif;letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;color:#CDA55B}
</style></head><body><div class="p"><div class="lock"><div class="k">Your Brand</div><div class="r"></div></div></div></body></html>
