<!doctype html>
<html><head><meta charset="utf-8"><title>Your Brand black-metal strip (375x123 pt)</title>
<style>
/* Store card strip, black brushed metal: no marble, just a matte black card face with a fine brushed grain, a soft diagonal light and a gold edge. Left stays calm for POINTS. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#141210}
.s{position:relative;width:375px;height:123px;overflow:hidden;
 background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,rgba(0,0,0,0) 1px 3px),
  linear-gradient(112deg,#080808 0%,#131110 34%,#0a0909 52%,#1d1a16 70%,#0a0908 100%)}
.s::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse 150px 90px at 275px 38px,rgba(231,194,125,.20),rgba(231,194,125,0) 100%),
  linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 45%)}
.s::after{content:"";position:absolute;inset:0;border-top:.5px solid rgba(205,165,91,.85);border-bottom:.5px solid rgba(205,165,91,.85)}
.lock{position:absolute;left:150px;width:224px;top:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.k{font:600 40px/1 Georgia,"Times New Roman",serif;letter-spacing:.46em;padding-left:.46em;
 background:linear-gradient(100deg,#8A6F3A 0%,#E3C07E 28%,#CDA55B 48%,#F6E4B0 62%,#B58D45 80%,#8A6F3A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(255,236,190,.28))}
.r{width:78px;height:1px;margin-top:11px;background:linear-gradient(90deg,transparent,#CDA55B,transparent)}
</style></head><body><div class="s"><div class="lock"><div class="k">Your Brand</div><div class="r"></div></div></div></body></html>
