<!doctype html>
<html><head><meta charset="utf-8"><title>Your Brand wallet banner (design source)</title>
<style>
/* One banner for Apple (strip) and Google (hero). Rendered at 1032x336; other sizes are scaled from it.
   Colours come from design/DESIGN-GUIDE.md. Keep the middle 60% free of detail: Apple and Google cover the edges. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1032px;height:336px;overflow:hidden;background:#141210}
.art{background-image:radial-gradient(ellipse at center,rgba(20,18,16,.50),rgba(20,18,16,0) 70%),url(ai-backgrounds/bg2.png)!important;background-size:cover!important;background-position:center!important;position:relative;width:1032px;height:336px;background:linear-gradient(155deg,#3A3228 0%,#26211B 52%,#141210 100%);overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(520px 300px at 80% -10%,rgba(205,165,91,.28),transparent 65%),radial-gradient(520px 320px at 8% 112%,rgba(90,70,40,.5),transparent 65%)}
.sheen{position:absolute;top:-40px;bottom:-40px;left:34%;width:160px;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,244,214,.10),transparent)}
.rule{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#CDA55B 30%,#E3C07E 50%,#CDA55B 70%,transparent)}
.rule.t{top:22px;opacity:.55}.rule.b{bottom:22px;opacity:.55}
.logo{position:absolute;left:50%;top:50%;height:226px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 28px rgba(205,165,91,.30))}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#E3C07E;box-shadow:0 0 12px 3px rgba(227,192,126,.55)}
.tag{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:italic 500 50px Georgia,'Times New Roman',serif;color:#E3C07E;letter-spacing:.02em;text-shadow:0 0 26px rgba(205,165,91,.35)}.tag:after{content:'';display:block;width:150px;height:2px;margin:22px auto 0;background:linear-gradient(90deg,transparent,#CDA55B,transparent)}</style></head><body><div class="art">

<span class="spark" style="left:12%;top:30%;opacity:.7"></span><span class="spark" style="left:21%;top:68%;opacity:.45;width:3px;height:3px"></span>
<span class="spark" style="left:83%;top:26%;opacity:.55;width:4px;height:4px"></span><span class="spark" style="left:91%;top:64%;opacity:.7"></span><span class="spark" style="left:70%;top:80%;opacity:.4;width:3px;height:3px"></span>
<div class="tag">Dine, disconnect &amp; flow<br>with the rhythm</div>
</div></body></html>
