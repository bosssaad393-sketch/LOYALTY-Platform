<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D0D0E">
<title>Spaloon Staff (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* Staff screen for the barber or reception phone/tablet. Flow: scan the guest's card → pick what was done and who did it → add the stamp.
   Fake data. A reward unlocks at the goal and staff mark it as given. */
body{min-height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:max(18px,env(safe-area-inset-top)) 20px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.who{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
h1{font:600 30px/1.1 var(--serif);margin-bottom:6px}.sub{color:var(--muted);margin-bottom:20px}
.scan{aspect-ratio:1;border-radius:22px;border:1px solid var(--line);background:linear-gradient(#0E0E0D,#1A1A18);position:relative;overflow:hidden;display:grid;place-items:center;margin-bottom:14px}
.scan .fr{width:62%;aspect-ratio:1;position:relative}
.scan .fr i{position:absolute;width:34px;height:34px;border:3px solid var(--gold)}
.scan .fr i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.scan .fr i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}.scan .fr i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}.scan .fr i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.scan .ln{position:absolute;left:19%;right:19%;height:2px;background:var(--gold);opacity:.7;animation:sw 2.2s ease-in-out infinite alternate}
@keyframes sw{from{top:22%}to{top:78%}}
.full{width:100%}
.or{text-align:center;color:var(--dim);font-size:13px;margin:12px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.gname{font:600 26px var(--serif)}.gmeta{color:var(--dim);font-size:13.5px}
.dots{display:flex;gap:7px;margin:12px 0 4px;flex-wrap:wrap}.dots i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--golddim)}.dots i.f{background:var(--gold);border-color:var(--gold)}.dots i.n{border-color:var(--gold);border-style:dashed}
.lab{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:none;color:var(--text);border-radius:12px;padding:10px 14px;font:500 14.5px var(--sans);cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--gold);background:var(--surface2);color:var(--gold2)}
.done{text-align:center;padding:30px 0}.done .big{font:600 64px/1 var(--serif);color:var(--gold)}
.reward{border:1px solid var(--gold);border-radius:16px;padding:16px;margin-top:12px;color:var(--gold2)}
.queue>div{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}.queue>div:first-child{border-top:0}.queue small{display:block;color:var(--dim)}
.in{margin-bottom:10px}
</style></head><body>
<div class="app" id="app"></div>
<script>
var ME='Yousef';
var REW={3:['10% off this visit'],6:['Free hair mask','20% off this visit'],9:['Free haircut, on the house']};
var G={name:'Ali Rashid',stamps:5,goal:9,since:'March 2026',usual:'The Gentleman',last:'12 days ago'};
var SVC=['Haircut','Fade cut','Beard trim','Shave','Blow-dry','Moroccan bath','Massage','Face wash & mask','Skin cleaning','Manicure','Pedicure','The Royal Hammam','The Gentleman','The Full Reset','The Groom'];
var TEAM=['Yousef','Hassan','Karim','Imad'];
var S={scr:'scan',pick:['Haircut','Beard trim'],by:ME};
function dots(n,f,next){var s='';for(var i=0;i<n;i++)s+='<i class="'+(i<f?'f':(next&&i===f?'n':''))+'"></i>';return '<div class="dots">'+s+'</div>'}
function head(){return '<div class="top"><div class="wm" style="display:flex;align-items:center;gap:12px"><img src="brand/logo-lux.png" alt="" style="width:46px;height:46px;border-radius:10px"><span>SPALOON<small>STAFF</small></span></div><span class="who">'+ME+'</span></div>'}
var V={
scan:function(){return head()+'<h1>Scan the card</h1><p class="sub">Ask the guest to open their Spaloon card and show the QR code.</p><div class="scan" data-go="guest"><div class="fr"><i></i><i></i><i></i><i></i></div><span class="ln"></span></div><button class="btn primary full" data-go="guest">Simulate a scan</button><p class="or">or</p><input class="in" placeholder="Search a member by name or last 4 digits"><div class="card"><div class="lab" style="margin-top:0">Next on your chair</div><div class="queue"><div><span>Ali Rashid<small>The Gentleman</small></span><span>17:30</span></div><div><span>Omar Khaled<small>Fade cut</small></span><span>19:15</span></div></div></div>'},
guest:function(){return head()+'<div class="card"><div class="gname">'+G.name+'</div><div class="gmeta">Member since '+G.since+' · last visit '+G.last+' · usually '+G.usual+'</div>'+dots(G.goal,G.stamps,true)+'<div class="gmeta">'+G.stamps+' of '+G.goal+' stamps. This visit '+(REW[G.stamps+1]?'<b style="color:var(--gold2)">unlocks: '+REW[G.stamps+1].join(' or ')+'</b>':'adds one')+'.</div></div>'+
 '<div class="lab">What was done</div><div class="chips">'+SVC.map(function(s){return '<button data-p="'+s+'" aria-pressed="'+(S.pick.indexOf(s)>-1)+'">'+s+'</button>'}).join('')+'</div>'+
 '<div class="lab">Done by</div><div class="chips">'+TEAM.map(function(t){return '<button data-by="'+t+'" aria-pressed="'+(S.by===t)+'">'+t+'</button>'}).join('')+'</div>'+
 '<button class="btn primary full" style="margin-top:22px" data-go="stamped" '+(S.pick.length?'':'disabled')+'>Add the stamp</button><button class="btn full" style="margin-top:10px;border:0;color:var(--dim)" data-go="scan">Cancel</button>'},
stamped:function(){var n=G.stamps+1,full=!!REW[n];S.rw=REW[n]||[];return head()+'<div class="done"><div class="lbl">Stamp added</div><div class="big">'+n+' / '+G.goal+'</div><div style="display:flex;justify-content:center">'+dots(G.goal,n)+'</div><p class="note" style="margin-top:8px">'+G.name+' · '+S.pick.join(', ')+' · by '+S.by+'</p>'+
 (full?'<div class="reward"><b style="font:600 20px var(--serif)">Reward unlocked</b><p class="note" style="color:var(--muted);margin:6px 0 12px">'+(S.rw.length>1?'The guest picks one. ':'')+'Use it now or within 30 days.</p><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center">'+S.rw.map(function(r,i){return '<button class="btn primary" data-rw="'+i+'">'+r+'</button>'}).join('')+'</div></div>':'')+
 '</div><button class="btn full" data-go="scan">Next guest</button>'},
given:function(){var last=G.stamps+1>=G.goal;return head()+'<div class="done"><div class="lbl">Reward given</div><div class="big" style="font-size:34px">'+S.given+'</div><p class="note" style="margin-top:10px">'+(last?G.name+'\'s card starts again at 0 / '+G.goal+'.':'Next reward at '+(Math.floor((G.stamps+1)/3)*3+3)+' stamps.')+'</p></div><button class="btn primary full" data-go="scan">Next guest</button>'}};
function go(s){S.scr=s;document.getElementById('app').innerHTML=V[s]();window.scrollTo(0,0)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-go],[data-p],[data-by],[data-rw]');if(!b||b.disabled)return;
 if(b.dataset.rw){S.given=S.rw[+b.dataset.rw];return go('given')}
 if(b.dataset.p){var i=S.pick.indexOf(b.dataset.p);if(i>-1)S.pick.splice(i,1);else S.pick.push(b.dataset.p);return go('guest')}
 if(b.dataset.by){S.by=b.dataset.by;return go('guest')}
 go(b.dataset.go)});
go(location.hash.slice(1)&&V[location.hash.slice(1)]?location.hash.slice(1):'scan');
</script></body></html>
