<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161615">
<title>Spaloon Guest (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* Guest flow, modelled on the tap-to-pass flow Saad sent as reference: stand → join → building your pass → pass ready → hub → services & packages.
   Fake data. Prices are blank on purpose (unknown until the owner sends the list). Package contents are drafts to confirm with the owner. */
body{min-height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100dvh;position:relative;padding:max(18px,env(safe-area-inset-top)) 20px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.lang{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:6px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.mark{width:58px;height:auto;color:var(--gold)}
h1{font:600 34px/1.08 var(--serif);margin:4px 0 8px}html[dir=rtl] h1{font:700 30px/1.25 var(--ar)}
.lead{color:var(--muted);margin-bottom:22px}
.scr{display:none;animation:in .45s cubic-bezier(.2,.7,.2,1) both}.scr.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.field{margin-bottom:16px}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:14px;margin:6px 0 20px}.check input{margin-top:4px;accent-color:var(--gold)}
.full{width:100%}
/* stand */
.stand{margin:6px auto 26px;width:230px;aspect-ratio:3/4;border-radius:20px;background:linear-gradient(160deg,#2A2927,#1B1B1A);border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:22px;position:relative}
.stand .qr{width:120px;height:120px;background:#F2EEE6;border-radius:10px;padding:8px}
.stand p{font:600 15px var(--serif);letter-spacing:.2em;color:var(--gold);margin-top:10px}
.pulse{position:absolute;inset:-1px;border-radius:20px;border:1px solid var(--gold);animation:pu 2.4s ease-out infinite;opacity:0}
@keyframes pu{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
/* pass */
.pass{border-radius:18px;overflow:hidden;background:#1E1D1B;border:1px solid #4A4436;color:var(--text);box-shadow:0 18px 40px -20px #000}
.pass .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.pass .hd .nm{display:flex;align-items:center;gap:10px;font:600 17px var(--serif);letter-spacing:.18em;color:var(--gold2)}
.pass .hd .nm svg{width:34px}
.pass .st{text-align:end;font-size:10px;letter-spacing:.14em;color:var(--dim)}.pass .st b{display:block;font:600 20px var(--serif);color:var(--text);letter-spacing:0}
.pass .hero{height:128px;background:url(interior.jpg) center 62%/cover}
.pass .row{display:flex;justify-content:space-between;padding:12px 16px 4px;font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.dots{display:flex;gap:7px;padding:4px 16px 14px}.dots i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--golddim)}.dots i.f{background:var(--gold);border-color:var(--gold)}
.pass .q{display:grid;place-items:center;padding:6px 0 16px}.pass .q div{background:#fff;padding:10px;border-radius:8px}.pass .q small{display:block;color:#555;font-size:9px;text-align:center;margin-top:4px}
.building .pass{animation:build 2.2s ease both}.building .pass .hero,.building .pass .q,.building .dots{animation:fade 1.4s .9s both}
@keyframes build{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}@keyframes fade{from{opacity:0}to{opacity:1}}
.wallet{display:flex;align-items:center;justify-content:center;gap:8px;background:#000;color:#fff;border:1px solid #333}
/* hub */
.hello{display:flex;align-items:center;gap:14px;margin-bottom:18px}.hello .av{width:52px;height:52px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center}.hello .av svg{width:32px;color:var(--gold)}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.prog p{font-size:14px;color:var(--muted);margin-bottom:10px}.prog p b{color:var(--text)}
.prog .dots{padding:0 0 14px}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--text);text-decoration:none;font-family:inherit;font-size:15px;font-weight:500;line-height:1.35;cursor:pointer;text-align:start}
.tile .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--gold)}.tile .ic svg{width:18px;height:18px}
.tile small{display:block;color:var(--dim);font-size:12.5px}
.tile.big{border-color:var(--golddim)}
.socials{display:flex;justify-content:center;gap:16px;margin:22px 0 8px}.socials a{color:var(--muted)}
.pow{text-align:center;color:var(--dim);font-size:11.5px;letter-spacing:.08em}
/* menu */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 16px;padding:0 20px}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:8px 14px;font:600 13.5px inherit;font-family:inherit;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#17130C}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.pk .ph{height:120px;background:var(--surface2) center/cover}
.pk .bd{padding:16px}
.pk h3{font:600 22px/1.15 var(--serif);margin-bottom:4px}html[dir=rtl] .pk h3{font:700 19px/1.3 var(--ar)}
.pk ul{list-style:none;margin:10px 0 14px}.pk li{padding:7px 0;border-top:1px solid var(--line);color:var(--muted);font-size:14.5px;display:flex;justify-content:space-between;gap:10px}.pk li:first-child{border-top:0}
.pk .ft{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font:600 15px var(--sans);color:var(--dim)}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:12px}
.svc div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.svc div:first-child{border-top:0}
.svc span small{display:block;color:var(--dim);font-size:12.5px}
.back{background:none;border:0;color:var(--muted);font:600 14px inherit;font-family:inherit;cursor:pointer;padding:6px 0;margin-bottom:8px}
.sheet{position:fixed;inset:0;background:rgba(8,8,7,.75);display:grid;place-items:end center;z-index:9}.sheet>div{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:22px 20px 30px;animation:up .3s ease both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
</style></head><body>
<div class="app" id="app"></div>
<script>

/* Package contents are DRAFTS built only from services on their wall banner; names and prices to confirm with the owner. */
var PK=[
 {id:'hammam',en:'The Royal Hammam',ar:'الحمّام الملكي',img:'',en_i:['Moroccan bath','Body scrub','Full body massage'],ar_i:['حمام مغربي','تقشير الجسم','مساج كامل']},
 {id:'gent',en:'The Gentleman',ar:'الجنتلمان',img:'interior.jpg',en_i:['Haircut','Beard trim & shape','Face wash & mask'],ar_i:['قص شعر','تهذيب اللحية','غسول وماسك للوجه']},
 {id:'reset',en:'The Full Reset',ar:'الريسِت الكامل',img:'',en_i:['Moroccan bath','Massage','Haircut & blow-dry','Skin cleaning'],ar_i:['حمام مغربي','مساج','قص شعر واستشوار','تنظيف بشرة']},
 {id:'groom',en:'The Groom',ar:'باقة العريس',img:'',en_i:['Moroccan bath','Skin cleaning','Haircut & styling','Shave','Manicure & pedicure'],ar_i:['حمام مغربي','تنظيف بشرة','قص وتسريحة','حلاقة','مانيكير وباديكير']},

 beard:[['Shave','حلاقة'],['Beard trim','تهذيب اللحية'],['Beard dyeing','صبغة اللحية'],['Beard conditioning','ترطيب اللحية']],
 spa:[['Moroccan bath','حمام مغربي'],['Massage','مساج']],
 skin:[['Face wash & mask','غسول وماسك'],['Skin cleaning','تنظيف بشرة'],['Waxing','واكس']],
 hands:[['Manicure','مانيكير'],['Pedicure','باديكير']]};
var S={lang:'en',scr:'stand',name:'Ali',stamps:6,tab:'pk'};
function t(k){return T[S.lang][k]}
function dots(n,f){var s='';for(var i=0;i<n;i++)s+='<i class="'+(i<f?'f':'')+'"></i>';return '<div class="dots">'+s+'</div>'}
function qr(size){var c=21,s='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+c+' '+c+'" shape-rendering="crispEdges">',seed=7;
 function r(){seed=(seed*9301+49297)%233280;return seed/233280}
 function fin(x,y){return (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13)}
 for(var y=0;y<c;y++)for(var x=0;x<c;x++){var on;if(fin(x,y)){var lx=x%14,ly=y%14;lx=x>13?x-14:x;ly=y>13?y-14:y;on=(lx===0||lx===6||ly===0||ly===6)||(lx>1&&lx<5&&ly>1&&ly<5)}else on=r()>.52;if(on)s+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
 return s+'</svg>'}
function pass(){return '<div class="pass"><div class="hd"><span class="nm">'+MARK+'SPALOON</span><span class="st">'+t('stamps').toUpperCase()+'<b>'+S.stamps+'/10</b></span></div><div class="hero"></div><div class="row"><span>'+t('member')+'</span><span>'+t('visits')+' · '+S.stamps+'</span></div>'+dots(10,S.stamps)+'<div class="q"><div>'+qr(118)+'<small>'+t('pow')+'</small></div></div></div>'}
function head(back){return '<div class="top">'+(back?'<button class="back" data-go="'+back+'">‹ '+t('back')+'</button>':'<div class="wm">SPALOON<small>SPA &amp; SALON FOR MEN</small></div>')+'<button class="lang" data-lang>'+(S.lang==='en'?'العربية':'English')+'</button></div>'}

 '<div class="tiles">'+tile('menu',t('menu'),t('menuS'),'data-go="menu"',1)+tile('wa',t('book'),t('bookS'),'href="'+WA+encodeURIComponent(S.lang==='ar'?'مرحبا، أبي أحجز موعد':'Hi, I would like to book')+'" target="_blank" rel="noopener"')+tile('gift',t('gifts'),t('giftsS'),'data-go="hub"')+tile('star',t('review'),t('reviewS'),'href="https://www.google.com/maps/search/?api=1&query=Spaloon%20Manama" target="_blank" rel="noopener"')+tile('pin',t('find'),t('findS'),'href="https://www.google.com/maps/search/?api=1&query=Spaloon%20Manama" target="_blank" rel="noopener"')+'</div>'+
 '<div class="socials"><a href="https://www.instagram.com/spaloonbh/" target="_blank" rel="noopener" aria-label="Instagram">'+I.ig+'</a><a href="'+WA+'" target="_blank" rel="noopener" aria-label="WhatsApp">'+I.wa.replace('<svg','<svg width="22" height="22"')+'</a></div><p class="pow">'+t('pow')+'</p>'},

 if(S.tab==='pk')h+=PK.map(function(p){var nm=p[S.lang],it=p[S.lang+'_i'];return '<div class="pk">'+(p.img?'<div class="ph" style="background-image:url('+p.img+')"></div>':'')+'<div class="bd"><h3>'+nm+'</h3><ul>'+it.map(function(i){return '<li>'+i+'</li>'}).join('')+'</ul><div class="ft"><span class="price">'+t('onreq')+'</span><a class="btn primary small" style="display:inline-grid;place-items:center;text-decoration:none" target="_blank" rel="noopener" href="'+WA+encodeURIComponent((S.lang==='ar'?'أبي أحجز: ':'I would like to book: ')+nm)+'">'+t('bookthis')+'</a></div></div></div>'}).join('')+'<p class="note">'+t('draft')+'</p>';
 else h+='<div class="svc">'+SV[S.tab].map(function(s){return '<div><span>'+s[S.lang==='ar'?1:0]+'</span><span class="price">'+t('onreq')+'</span></div>'}).join('')+'</div>';

document.addEventListener('click',function(e){var b=e.target.closest('[data-go],[data-lang],[data-tab],[data-qr],[data-x]');if(!b)return;
 if(b.hasAttribute('data-lang')){S.lang=S.lang==='en'?'ar':'en';document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';return go(S.scr)}
 if(b.dataset.tab){S.tab=b.dataset.tab;return go('menu')}
 if(b.hasAttribute('data-qr')){var d=document.createElement('div');d.className='sheet';d.innerHTML='<div><p class="lbl" style="text-align:center">'+t('showqr')+'</p><div style="display:grid;place-items:center;margin:12px 0"><div style="background:#fff;padding:14px;border-radius:12px">'+qr(200)+'</div></div><p class="note" style="text-align:center;margin-bottom:16px">'+t('scan')+'</p><button class="btn full" data-x>'+t('close')+'</button></div>';d.onclick=function(ev){if(ev.target===d||ev.target.closest('[data-x]'))d.remove()};document.body.appendChild(d);return}
 if(b.dataset.go){if(S.scr==='join'){var n=document.getElementById('n');if(n&&n.value.trim())S.name=n.value.trim()}go(b.dataset.go)}});
