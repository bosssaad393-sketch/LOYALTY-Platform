/* logo intro: big in the centre, build band by band, then glide up into place */
function intro(){var root=document.querySelector('.scr.on'),lg=document.getElementById('logo');
 if(!S.intro||matchMedia('(prefers-reduced-motion: reduce)').matches){root.classList.add('shown');return}
 S.intro=false;var r=lg.getBoundingClientRect(),dy=innerHeight/2-(r.top+r.height/2),sc=Math.min(1.45,(innerWidth*.86)/r.width);

 setTimeout(function(){lg.style.transition='';lg.style.transform='none';root.classList.add('shown')},2500)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-go],[data-lang],[data-tab],[data-wifi]');if(!b)return;

  w.onclick=function(ev){if(ev.target===w||ev.target.closest('[data-x]'))return w.remove();var c=ev.target.closest('[data-cp]');if(c){try{navigator.clipboard.writeText(WIFI.pass)}catch(_){}c.textContent=t('copied')}};document.body.appendChild(w);return}
 if(b.dataset.go){if(S.scr==='join'&&b.dataset.go==='build'){var n=document.getElementById('n'),ph=document.getElementById('p'),ag=document.getElementById('ag'),er=document.getElementById('er'),dg=(ph.value||'').replace(/\D/g,'').replace(/^973/,'');var bad=!n.value.trim()?(S.lang==='ar'?'اكتب اسمك.':'Please write your name.'):dg.length!==8?(S.lang==='ar'?'اكتب رقم جوال بحريني من ٨ أرقام.':'Please enter an 8-digit Bahrain mobile number.'):!ag.checked?(S.lang==='ar'?'وافق على الشروط لإنشاء البطاقة.':'Please agree to the terms to create your card.'):'';if(bad){er.textContent=bad;er.hidden=false;return}S.name=n.value.trim()}show(b.dataset.go)}});
var h0=location.hash.slice(1);if(h0==='still')S.intro=false;show(V[h0]?h0:'home');
