<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Inter:wght@500;600&family=Tajawal:wght@500;700;800&display=block" rel="stylesheet"><title>Spaloon: scan to explore (A4)</title><style>/* Station / waiting-area card, A6. Same QR as the till card (opens the guest page). Shows what guests find when they scan. */
@page{size:210mm 297mm;margin:0}html,body{width:210mm;height:297mm;overflow:hidden}.wrap{width:210mm;height:297mm;display:grid;place-items:center;background:#0D0D0E}.wrap .card{zoom:2.0000}:root{--bg:#0D0D0E;--gold:#C9AE74;--gold2:#E3CD9B;--cr:#F3EDDF;--mut:#B9B1A0;--dim:#857E70}
*{box-sizing:border-box;margin:0;padding:0}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:"Tajawal",sans-serif;color:var(--cr);background:var(--bg)}
.card{position:relative;width:105mm;height:148mm;overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,#211D17 0%,var(--bg) 62%);display:flex;flex-direction:column;align-items:center;padding:8mm 8.5mm 7mm}
.frame{position:absolute;inset:4mm;border:.3mm solid rgba(201,174,116,.55);border-radius:2mm;pointer-events:none}
.frame::after{content:"";position:absolute;inset:1mm;border:.15mm solid rgba(201,174,116,.28);border-radius:1.4mm}
.logo{width:28mm;height:28mm;object-fit:contain;margin-top:-1.5mm}
h1{font:800 7.6mm/1.15 "Tajawal";text-align:center}
h1 em{font-style:normal;color:var(--gold2)}
.en{font:italic 500 4.1mm/1.2 "Bodoni Moda",serif;color:var(--mut);margin-top:.4mm;letter-spacing:.02em}
.qr{margin-top:3mm;background:var(--cr);border-radius:3mm;padding:3mm 3mm 2mm;display:flex;flex-direction:column;align-items:center}
.qr img{width:31mm;height:31mm;display:block}
.qr span{font:600 2.5mm "Inter";color:#4A4337;margin-top:1.4mm;letter-spacing:.14em}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8mm;margin-top:3.6mm;width:100%}
.tile{text-align:center;border:.2mm solid rgba(201,174,116,.35);border-radius:2mm;padding:2mm .8mm 1.6mm}
.tile.top{background:rgba(201,174,116,.10);border-color:var(--gold)}
.tile i{display:block;width:5.2mm;height:5.2mm;margin:0 auto 1mm;color:var(--gold2)}
.tile i svg{width:100%;height:100%;display:block}
.tile p{font:700 2.75mm/1.2 "Tajawal";color:var(--cr)}
.tile small{display:block;font:500 2.05mm/1.2 "Inter";color:var(--dim);margin-top:.4mm;direction:ltr}
.foot{margin-top:auto;text-align:center}
.foot small{display:block;font:500 2.1mm "Inter";letter-spacing:.2em;color:var(--dim);direction:ltr}html.png,html.png body{width:auto;height:auto}html.png .wrap{zoom:1.5625}</style></head><body><script>if(location.search.indexOf("png")>-1)document.documentElement.classList.add("png")</script><div class="wrap"><div class="card "><div class="frame"></div><img class="logo" src="../brand/logo-lux.png" alt="Spaloon"><h1>امسح <em>واكتشف</em></h1><div class="en">Scan to explore</div><div class="qr"><img src="qr.svg" alt="QR"><span>امسح · SCAN ME</span></div><div class="tiles"><div class="tile"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg></i><p>المنيو</p><small>Menu & prices</small></div><div class="tile"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M9 14h2M13 14h2"/></svg></i><p>احجز جلستك</p><small>Book on WhatsApp</small></div><div class="tile"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19.2" r="1" fill="currentColor"/></svg></i><p>الواي فاي</p><small>Wi-Fi</small></div><div class="tile"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1L3.2 9.4l6.1-.8z"/></svg></i><p>قيّمنا في Google</p><small>Google review</small></div><div class="tile"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg></i><p>احفظ رقمنا</p><small>Save our number</small></div><div class="tile top"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/></svg></i><p>بطاقة الولاء</p><small>Loyalty card</small></div></div><div class="foot"><small>POWERED BY ORBYN</small></div></div></div></body></html>
